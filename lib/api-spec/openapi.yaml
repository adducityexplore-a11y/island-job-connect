openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: The Jobs MV Phase 1 API
servers:
  - url: /api
paths:
  /recruiter/register:
    post:
      operationId: registerRecruiter
      security:
        - ClerkCookieAuth: []
        - ClerkBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecruiterRegistrationRequest"
      responses:
        "200":
          description: Existing employer profile already linked to this Clerk account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      security:
        - ClerkCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /jobs:
    get:
      operationId: listPublicJobs
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: department
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: experienceLevel
          in: query
          schema:
            type: string
            enum: [Entry Level, 1-2 Years, 3-5 Years, 5+ Years]
        - name: candidateScope
          in: query
          schema:
            type: string
            enum: [Local, International, Both]
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicJob"
  /jobs/{id}:
    get:
      operationId: getPublicJob
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Active public job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicJob"
        "404":
          $ref: "#/components/responses/Error"
  /companies:
    get:
      operationId: listPublicCompanies
      responses:
        "200":
          description: Public companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicCompany"
  /companies/{id}:
    get:
      operationId: getPublicCompany
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Public company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCompany"
        "404":
          $ref: "#/components/responses/Error"
  /jobs/{id}/view:
    post:
      operationId: recordJobView
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /jobs/{id}/apply:
    post:
      operationId: recordLegacyJobApplication
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /jobs/{id}/applications:
    post:
      operationId: createApplication
      security:
        - ClerkCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "409":
          $ref: "#/components/responses/Error"
  /jobs/{id}/application-status:
    get:
      operationId: getCandidateJobApplicationStatus
      security:
        - ClerkCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The signed-in candidate's application state for this job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateJobApplicationStatus"
        "401":
          $ref: "#/components/responses/Error"
  /employer/jobs:
    get:
      operationId: listRecruiterJobs
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecruiterJob"
    post:
      operationId: createRecruiterJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecruiterJob"
  /employer/jobs/{id}:
    put:
      operationId: updateRecruiterJob
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecruiterJob"
    delete:
      operationId: closeRecruiterJob
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /employer/jobs/{id}/repost:
    post:
      operationId: repostRecruiterJob
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecruiterJob"
  /employer/jobs/expired:
    delete:
      operationId: closeExpiredRecruiterJobs
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionResult"
  /recruiter/company:
    get:
      operationId: getCompanyProfile
      responses:
        "200":
          description: Company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
    patch:
      operationId: updateCompanyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyProfileUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
  /recruiter/dashboard:
    get:
      operationId: getRecruiterDashboard
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecruiterDashboard"
  /candidate/profile:
    get:
      operationId: getCandidateProfile
      security:
        - ClerkCookieAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfile"
    put:
      operationId: upsertCandidateProfile
      security:
        - ClerkCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateProfileUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfile"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfile"
  /candidate/cv/upload-url:
    post:
      operationId: requestCandidateCvUploadUrl
      security:
        - ClerkCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateCvUploadRequest"
      responses:
        "200":
          description: Private URL for directly uploading the candidate's CV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateCvUploadResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /candidate/cv:
    get:
      operationId: downloadCandidateCv
      security:
        - ClerkCookieAuth: []
      responses:
        "200":
          description: Candidate CV
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/msword:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
  /candidate/cv/complete:
    post:
      operationId: completeCandidateCvUpload
      security:
        - ClerkCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateCvUploadCompleteRequest"
      responses:
        "200":
          description: CV upload was verified and activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateCvUploadCompleteResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /candidate/applications:
    get:
      operationId: listCandidateApplications
      security:
        - ClerkCookieAuth: []
      responses:
        "200":
          description: Candidate applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CandidateApplication"
  /candidate/saved-jobs:
    get:
      operationId: listCandidateSavedJobs
      security:
        - ClerkCookieAuth: []
      responses:
        "200":
          description: Saved job IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
  /candidate/saved-jobs/{jobId}:
    put:
      operationId: saveCandidateJob
      security:
        - ClerkCookieAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedJob"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCandidateSavedJob
      security:
        - ClerkCookieAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved job removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "409":
          $ref: "#/components/responses/Error"
  /recruiter/applications:
    get:
      operationId: listRecruiterApplications
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecruiterApplication"
  /recruiter/applications/{id}:
    get:
      operationId: getRecruiterApplication
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
  /recruiter/candidates/{id}:
    get:
      operationId: getRecruiterCandidate
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecruiterCandidateProfile"
  /recruiter/candidates/{id}/cv:
    get:
      operationId: downloadRecruiterCandidateCv
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Candidate CV
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
  /recruiter/applications/{id}/status:
    patch:
      operationId: updateApplicationStatus
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationStatusUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
  /recruiter/jobs/{id}/status:
    patch:
      operationId: updateVacancyStatus
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VacancyStatusUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecruiterJob"
  /admin/overview:
    get:
      operationId: getAdminOverview
      security:
        - ClerkCookieAuth: []
      responses:
        "200":
          description: Administration overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/function-check:
    get:
      operationId: getAdminFunctionCheck
      security:
        - ClerkCookieAuth: []
      responses:
        "200":
          description: Sanitized service checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFunctionCheck"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/employers:
    get:
      operationId: listAdminEmployers
      security:
        - ClerkCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Employers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEmployersPage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/employers/{id}/verification:
    patch:
      operationId: updateAdminEmployerVerification
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployerVerificationUpdate"
      security:
        - ClerkCookieAuth: []
      responses:
        "200":
          description: Updated employer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEmployer"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/jobs:
    get:
      operationId: listAdminJobs
      security:
        - ClerkCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobsPage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/jobs/{id}/close:
    post:
      operationId: closeAdminJob
      security:
        - ClerkCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Closed job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJob"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/jobs/{id}/verification:
    patch:
      operationId: updateAdminJobVerification
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobVerificationUpdate"
      security:
        - ClerkCookieAuth: []
      responses:
        "200":
          description: Updated job verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJob"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/jobs/{id}/repost:
    post:
      operationId: repostAdminJob
      security:
        - ClerkCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Reposted job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJob"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/candidates:
    get:
      operationId: listAdminCandidates
      security:
        - ClerkCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCandidatesPage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/candidates/{id}/review:
    patch:
      operationId: updateAdminCandidateReview
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateReviewUpdate"
      security:
        - ClerkCookieAuth: []
      responses:
        "200":
          description: Updated candidate review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCandidate"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/applications:
    get:
      operationId: listAdminApplications
      security:
        - ClerkCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationsPage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/applications/{id}:
    get:
      operationId: getAdminApplication
      security:
        - ClerkCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationDetail"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/applications/{id}/status:
    patch:
      operationId: updateAdminApplicationStatus
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminApplicationStatusUpdate"
      security:
        - ClerkCookieAuth: []
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplication"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/audit-events:
    get:
      operationId: listAdminAuditEvents
      security:
        - ClerkCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditEventsPage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /employer/recruitment-requests:
    get:
      operationId: listEmployerRecruitmentRequests
      security:
        - ClerkCookieAuth: []
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployerRecruitmentRequestSummary"
    post:
      operationId: createEmployerRecruitmentRequest
      security:
        - ClerkCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecruitmentRequestCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecruitmentRequest"
  /employer/recruitment-requests/{id}:
    get:
      operationId: getEmployerRecruitmentRequest
      security:
        - ClerkCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployerRecruitmentRequestDetail"
  /employer/recruitment-requests/{id}/urgent-service:
    patch:
      operationId: respondToUrgentServiceTerms
      security:
        - ClerkCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UrgentServiceEmployerResponse"
      responses:
        "200":
          description: Urgent service response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecruitmentRequest"
  /employer/recruitment-requests/{id}/shortlist/{candidateId}/action:
    patch:
      operationId: employerRecruitmentCandidateAction
      security:
        - ClerkCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: candidateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployerRecruitmentAction"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecruitmentAssignment"
  /admin/recruitment-requests:
    get:
      operationId: listAdminRecruitmentRequests
      security:
        - ClerkCookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: urgency
          in: query
          schema:
            type: string
        - name: property
          in: query
          schema:
            type: string
        - name: department
          in: query
          schema:
            type: string
        - name: position
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecruitmentRequest"
  /admin/recruitment-requests/urgent-metrics:
    get:
      operationId: getAdminUrgentRecruitmentMetrics
      security:
        - ClerkCookieAuth: []
      responses:
        "200":
          description: Urgent Hiring conversion and fulfillment metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UrgentServiceMetrics"
  /admin/recruitment-requests/{id}:
    get:
      operationId: getAdminRecruitmentRequest
      security:
        - ClerkCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRecruitmentRequestDetail"
  /admin/recruitment-requests/{id}/status:
    patch:
      operationId: updateAdminRecruitmentRequestStatus
      security:
        - ClerkCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
