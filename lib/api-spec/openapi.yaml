      required: [id, requestId, candidateId, assignedByClerkUserId, createdAt, updatedAt]
      properties:
        id: { type: integer }
        requestId: { type: integer }
        candidateId: { type: integer }
        decision: { type: [string, "null"] }
        employerAction: { type: [string, "null"] }
        invitedToInterviewAt: { type: [string, "null"], format: date-time }
        hiredAt: { type: [string, "null"], format: date-time }
        matchScore: { type: [integer, "null"] }
        aiScreeningStatus: { type: [string, "null"] }
        aiScreeningCategory: { type: [string, "null"] }
        aiScreeningScore: { type: [integer, "null"] }
        aiScreeningSummary: { type: [string, "null"] }
        aiScreeningStrengths: { type: [array, "null"], items: { type: string } }
        aiScreeningGaps: { type: [array, "null"], items: { type: string } }
        aiScreeningMandatoryConcerns: { type: [array, "null"], items: { type: string } }
        aiScreenedAt: { type: [string, "null"], format: date-time }
        assignedByClerkUserId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RecruitmentStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - Vacancy
            - Applications
            - Screening
            - Expert Review
            - Interview-Ready Shortlist
            - Employer Interview
            - Position Filled
            - Closed
        note:
          type: string
          maxLength: 1000
        jobId:
          type:
            - integer
            - "null"
    UrgentServiceEmployerResponse:
      type: object
      required: [response]
      properties:
        response:
          type: string
          enum: [Accepted, Declined]
    UrgentServiceAdminUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [Terms Ready, Active, Fulfilled, Declined]
        terms:
          type: string
          minLength: 10
          maxLength: 2000
    UrgentServiceMetrics:
      type: object
      required: [requested, termsReady, accepted, active, fulfilled, declined, conversionRate, averageFulfillmentHours, interviews, hires]
      properties:
        requested: { type: integer }
        termsReady: { type: integer }
        accepted: { type: integer }
        active: { type: integer }
        fulfilled: { type: integer }
        declined: { type: integer }
        conversionRate: { type: number }
        averageFulfillmentHours: { type: [number, "null"] }
        interviews: { type: integer }
        hires: { type: integer }
    RecruitmentCandidateAssignmentRequest:
      type: object
      properties:
        decision:
          type: string
    RecruitmentCandidateDecisionRequest:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
        reason:
          type: string
          maxLength: 2000
    RecruitmentAdminNoteRequest:
      type: object
      required:
        - note
      properties:
        note:
          type: string
        candidateId:
          type: integer
    EmployerRecruitmentAction:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - Invite for Interview
            - Reject
            - Keep for Review
            - Mark Hired
    AdminRecruitmentRequestDetail:
      type: object
      properties:
        counters:
          type: object
          properties:
            applicationsReceived:
              type: integer
            assignedCandidates:
              type: integer
            suitableCandidates:
              type: integer
            shortlistedCandidates:
              type: integer
            interviewCandidates:
              type: integer
            hiredCandidates:
              type: integer
        history:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              status:
                type: string
              note:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time
        assignments:
          type: array
          items:
            type: object
            properties:
              candidate:
                $ref: "#/components/schemas/CandidateProfile"
              assignment:
                type: object
                properties:
                  decision:
                    type: string
                    nullable: true
                  employerAction:
                    type: string
                    nullable: true
                  matchScore:
                    type: integer
                    nullable: true
                  aiScreeningStatus:
                    type: string
                    nullable: true
                  aiScreeningCategory:
                    type: string
                    nullable: true
                  aiScreeningScore:
                    type: integer
                    nullable: true
                  aiScreeningSummary:
                    type: string
                    nullable: true
                  aiScreeningStrengths:
                    type: array
                    nullable: true
                    items: { type: string }
                  aiScreeningGaps:
                    type: array
                    nullable: true
                    items: { type: string }
                  aiScreeningMandatoryConcerns:
                    type: array
                    nullable: true
                    items: { type: string }
                  aiScreenedAt:
                    type: string
                    format: date-time
                    nullable: true
        notes:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              note:
                type: string
              candidateId:
                type: integer
                nullable: true
              createdAt:
                type: string
                format: date-time
      allOf:
        - $ref: "#/components/schemas/RecruitmentRequest"
    AdminCandidatePoolItem:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/CandidateProfile"
        match:
          type: object
          properties:
            score:
              type: integer
            availableCriteria:
              type: integer
            criteria:
              type: array
              items:
                type: object
                properties:
                  criterion:
                    type: string
                  matched:
                    type: boolean
