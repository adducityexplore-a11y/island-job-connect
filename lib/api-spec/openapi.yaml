        desiredPosition: { type: [string, "null"] }
        department: { type: [string, "null"] }
        yearsExperience: { type: [string, "null"] }
        hospitalitySpecialties: { type: [string, "null"] }
        languages: { type: [string, "null"] }
        availability: { type: [string, "null"] }
        availabilityStatus: { type: [string, "null"] }
        totalHospitalityExperience: { type: [string, "null"] }
        totalResortExperience: { type: [string, "null"] }
