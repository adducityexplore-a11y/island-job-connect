kind = "web"
previewPath = "/web/"
title = "The Jobs MV Web Platform"
description = "A responsive Maldives hospitality recruitment platform for job seekers, employers, recruiters, and The Jobs MV administrators, optimized for mobile browsers through desktop."
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[services]]
name = "web"
paths = [ "/web/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/web run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/web", "run", "build" ]

[services.production.build.env]
VITE_PUBLIC_SITE_URL = "https://island-job-connect--adducityexplore.replit.app"

[services.production.run]
args = [ "node", "--enable-source-maps", "artifacts/web/dist/server.mjs" ]

[services.production.run.env]
PUBLIC_SITE_URL = "https://island-job-connect--adducityexplore.replit.app"

[services.env]
PORT = "22333"
BASE_PATH = "/web/"
VITE_PUBLIC_SITE_URL = "https://island-job-connect--adducityexplore.replit.app"
